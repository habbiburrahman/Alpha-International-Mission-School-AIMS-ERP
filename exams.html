
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS ERP - Exam Management</title>
    <link rel="stylesheet" href="exams.css">
</head>
<body>

    <div class="container">

        <header class="page-header">
            <div>
                <h1>AIMS ERP</h1>
                <h2>Exam Management</h2>
                <p>Manage school examinations and academic results</p>
            </div>

            <a href="dashboard.html" class="back-btn">
                ← Back to Dashboard
            </a>
        </header>

        <section class="summary-cards">

            <div class="summary-card">
                <h3>Total Exams</h3>
                <p id="totalExams">0</p>
            </div>

            <div class="summary-card">
                <h3>Upcoming Exams</h3>
                <p id="upcomingExams">0</p>
            </div>

            <div class="summary-card">
                <h3>Completed Exams</h3>
                <p id="completedExams">0</p>
            </div>

        </section>

        <section class="form-section">

            <h2>Create New Exam</h2>

            <form id="examForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="examName">Exam Name</label>
                        <input
                            type="text"
                            id="examName"
                            placeholder="Example: Half Yearly Examination"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="examType">Exam Type</label>
                        <select id="examType" required>
                            <option value="">Select Exam Type</option>
                            <option value="Unit Test">Unit Test</option>
                            <option value="Monthly Test">Monthly Test</option>
                            <option value="Half Yearly">Half Yearly</option>
                            <option value="Annual">Annual</option>
                            <option value="Final">Final Examination</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="className">Class</label>
                        <select id="className" required>
                            <option value="">Select Class</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="examDate">Exam Date</label>
                        <input type="date" id="examDate" required>
                    </div>

                    <div class="form-group">
                        <label for="totalMarks">Total Marks</label>
                        <input
                            type="number"
                            id="totalMarks"
                            min="1"
                            placeholder="100"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="passingMarks">Passing Marks</label>
                        <input
                            type="number"
                            id="passingMarks"
                            min="0"
                            placeholder="33"
                            required
                        >
                    </div>

                </div>

                <button type="submit" id="saveExam">
                    Create Exam
                </button>

                <p id="message"></p>

            </form>

        </section>

        <section class="table-section">

            <h2>Examination Records</h2>

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>Exam ID</th>
                            <th>Exam Name</th>
                            <th>Exam Type</th>
                            <th>Class</th>
                            <th>Exam Date</th>
                            <th>Total Marks</th>
                            <th>Passing Marks</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="examTableBody">
                        <tr>
                            <td colspan="8">Loading exams...</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="exams.js"></script>

</body>
</html>
