
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS ERP - Fee Invoices</title>
    <link rel="stylesheet" href="fee-invoices.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>AIMS ERP</h1>
            <p>Fee Invoice Management</p>
        </header>

        <main>
            <h2>Generate Fee Invoice</h2>

            <div class="invoice-form">

                <label for="student">Select Student</label>
                <select id="student">
                    <option value="">Loading Students...</option>
                </select>

                <label for="academicYear">Academic Year</label>
                <select id="academicYear">
                    <option value="">Select Academic Year</option>
                </select>

                <label for="invoiceNumber">Invoice Number</label>
                <input type="text" id="invoiceNumber" readonly>

                <label for="issueDate">Issue Date</label>
                <input type="date" id="issueDate">

                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate">

                <label for="totalAmount">Total Amount (₹)</label>
                <input type="number" id="totalAmount" min="0" step="0.01">

                <button type="button" id="generateInvoice">
                    Generate Invoice
                </button>

                <p id="message"></p>

            </div>

            <h2>Invoice Records</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Invoice No.</th>
                            <th>Student ID</th>
                            <th>Issue Date</th>
                            <th>Due Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="invoiceList">
                        <tr>
                            <td colspan="6">Loading invoices...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="fee-invoices.js"></script>

</body>
</html>
