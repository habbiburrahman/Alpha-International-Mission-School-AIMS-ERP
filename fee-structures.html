
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS - Fee Structures</title>
    <link rel="stylesheet" href="fee-structures.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>AIMS ERP</h1>
            <p>Fee Structure Management</p>
        </div>
        <a href="fees.html" class="back-btn">Back to Fees</a>
    </header>

    <main class="container">

        <section class="form-card">
            <h2>Create Fee Structure</h2>
            <p class="subtitle">Set class-wise fees for an academic year.</p>

            <form id="feeStructureForm">

                <div class="form-group">
                    <label for="classSelect">Select Class</label>
                    <select id="classSelect" required>
                        <option value="">Loading classes...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="academicYearSelect">Academic Year</label>
                    <select id="academicYearSelect" required>
                        <option value="">Loading academic years...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="feeCategorySelect">Fee Category</label>
                    <select id="feeCategorySelect" required>
                        <option value="">Select Fee Category</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Fee Amount (₹)</label>
                    <input type="number" id="amount" min="1" step="0.01"
                        placeholder="Enter fee amount" required>
                </div>

                <button type="submit" id="saveBtn">Save Fee Structure</button>

                <p id="message"></p>

            </form>
        </section>

        <section class="table-card">
            <h2>Existing Fee Structures</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Class</th>
                            <th>Academic Year</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="structureTableBody">
                        <tr>
                            <td colspan="5">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./fee-structures.js"></script>

</body>
</html>
