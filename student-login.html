<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIMS - Student Login</title>
    <link rel="stylesheet" href="student-login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">

            <div class="school-brand">
                <img src="logo.jpg" alt="AIMS School Logo">

                <h1>Alpha International Mission School</h1>
                <p>Excellence in Education</p>
            </div>

            <div class="login-heading">
                <h3>Student/Parent Login</h3>
                <p>Welcome back! Please login to continue.</p>
            </div>

            <form id="studentLoginForm">

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input
                        type="text"
                        id="studentId"
                        required
                        autocomplete="username"
                        placeholder="Enter your Student ID"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                    >
                </div>

                <button type="submit" id="loginBtn">
                    Login to Student Portal
                </button>

            </form>

            <p id="message"></p>

            <div class="login-footer">
                <p>Student Portal</p>
                <span>© 2026 Alpha International Mission School</span>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="student-login.js"></script>

</body>
</html>
